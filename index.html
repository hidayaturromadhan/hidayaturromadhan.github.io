  <style>
    :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --accent:#36bcf7; --line:#21262d; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: var(--bg); color: var(--fg);
      font-family: ui-monospace, "Fira Code", Menlo, Consolas, monospace;
    }
    main { width: 100%; max-width: 640px; animation: fade .8s ease both; }
    .prompt { color: var(--accent); font-size: 14px; margin-bottom: 12px; }
    h1 { font-size: clamp(32px, 7vw, 52px); line-height: 1.1; margin-bottom: 12px; }
    .role { color: var(--accent); font-size: 15px; margin-bottom: 20px; }
    .role::after { content: "_"; animation: blink 1s steps(1) infinite; }
    p { color: var(--muted); line-height: 1.7; font-size: 15px; margin-bottom: 28px;
        padding-top: 20px; border-top: 1px solid var(--line); }
    .links { display: flex; flex-wrap: wrap; gap: 10px; }
    a {
      color: var(--fg); text-decoration: none; font-size: 14px;
      border: 1px solid var(--line); padding: 8px 14px; border-radius: 8px;
      transition: border-color .2s, transform .2s, color .2s;
    }
    a:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }
    @keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
